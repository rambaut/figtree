# ─────────────────────────────────────────────────────────────────────────────
# FigTree — Release workflow
#
# Triggered by pushing a version tag (e.g. v1.5.0 or v1.5.0-beta1).
#
# Jobs
# ────
#  build-jars        ubuntu-latest   Compile Java sources, upload figtree.jar
#                                    as a reusable artifact.
#
#  package-mac       macos-latest    Download JAR, run jpackage to produce a
#                                    self-contained .app with bundled JRE
#                                    → signed DMG → notarised + stapled
#
#  package-linux     ubuntu-latest   Download JAR, produce Linux package:
#                                      • shell script + JAR → GNU-tar TGZ
#
#  package-windows   windows-latest  Download JAR, run jpackage to produce a
#                                    self-contained app-image with bundled JRE
#                                    → ZIP. (jpackage cannot cross-compile, so
#                                    Windows packaging needs its own runner.)
#
#  release           ubuntu-latest   Create a (draft) GitHub Release and attach
#                                    all platform archives.
#
# Required GitHub repository secrets
# ────────────────────────────────────
#  MACOS_APP_CERT                Base64-encoded Developer ID Application .p12
#                                  openssl pkcs12 -export ... | base64 | pbcopy
#  MACOS_APP_CERT_PASSWORD       Password used when exporting the .p12
#  KEYCHAIN_PASSWORD             Any random string; used for the temporary
#                                  CI keychain (never leaves the runner)
#  APPLE_NOTARIZE_APPLE_ID       Apple ID email address (e.g. user@example.com)
#  APPLE_NOTARIZE_TEAM_ID        10-character Apple Team ID (e.g. 9E4WXAQ6SE)
#  APPLE_NOTARIZE_PASSWORD       App-specific password from appleid.apple.com
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'

# Only one release pipeline runs at a time; a newer tag cancels the old one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Compile Java sources and upload the JAR as an artifact.
  #    Using the cheapest runner for the CPU-heavy compilation step.
  # ───────────────────────────────────────────────────────────────────────────
  build-jars:
    name: Build JAR
    runs-on: ubuntu-latest

    outputs:
      version:        ${{ steps.parse-tag.outputs.version }}
      version_number: ${{ steps.parse-tag.outputs.version_number }}
      extra_tag:      ${{ steps.parse-tag.outputs.extra_tag }}

    steps:
      - uses: actions/checkout@v4

      # Java 11 is used for compilation; source/target compatibility is set
      # to 11 inside build.xml.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Parse the tag into its component parts:
      #   v1.5.0-beta1  →  version=1.5.0  extra_tag=-beta1
      #   v1.5.0        →  version=1.5.0  extra_tag=
      - name: Parse version from tag
        id: parse-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${TAG%%-*}"          # everything before the first hyphen
          if [[ "$TAG" == *"-"* ]]; then
            EXTRA_TAG="-${TAG#*-}"     # everything after the first hyphen
          else
            EXTRA_TAG=""
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$EXTRA_TAG"    >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$VERSION  extra_tag=$EXTRA_TAG"

      - name: Build JAR (ant dist)
        run: |
          ant -f build.xml dist \
            -Dversion="${{ steps.parse-tag.outputs.version }}" \
            -Dversion_number="${{ steps.parse-tag.outputs.version_number }}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: figtree-jar
          path: dist/figtree.jar
          retention-days: 1


  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build Mac package on a macOS runner.
  #
  #    jpackage creates a self-contained FigTree.app with the JDK 21 runtime
  #    bundled inside (no system Java required). Steps:
  #      1. jpackage --type app-image  →  FigTree.app  (unsigned)
  #      2. sign all dylibs + executables in Contents/runtime/ individually
  #      3. hdiutil create  →  FigTree v<ver>.dmg
  #      4. notarytool submit --wait  (blocks until Apple responds)
  #      5. stapler staple + validate
  # ───────────────────────────────────────────────────────────────────────────
  package-mac:
    name: Package (Mac)
    needs: build-jars
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21 provides both jpackage (to build the .app) and the JRE that
      # gets bundled inside it. No separate Zulu install needed.
      - name: Set up JDK 21 (jpackage + bundled runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Restore the JAR built in job 1
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: figtree-jar
          path: dist/

      # ── Convenience variables ──────────────────────────────────
      - name: Set version env vars
        run: |
          echo "VERSION=${{ needs.build-jars.outputs.version }}"             >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=${{ needs.build-jars.outputs.version_number }}" >> "$GITHUB_ENV"
          echo "EXTRA_TAG=${{ needs.build-jars.outputs.extra_tag }}"         >> "$GITHUB_ENV"

      # ── Mac code-signing setup ─────────────────────────────────
      #
      # We import the certificate into a short-lived keychain that only
      # exists for the duration of this job. All secrets stay in memory;
      # the decoded .p12 file is deleted immediately after import.
      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/figtree-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Keep unlocked for up to 6 hours (notarisation wait can be slow)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

      - name: Import Developer ID Application certificate
        env:
          CERT_B64:  ${{ secrets.MACOS_APP_CERT }}
          CERT_PASS: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/app_cert.p12"
          security import "$RUNNER_TEMP/app_cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASS" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app_cert.p12"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Derive the full identity string from the imported cert so we do not
      # have to hard-code it in the workflow or in a secret.
      - name: Resolve signing identity
        run: |
          APP_SIGNER=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | head -1 \
            | awk '{print $2}')
          echo "APP_SIGNER=$APP_SIGNER" >> "$GITHUB_ENV"
          echo "Resolved Application signer: $APP_SIGNER"

      # ── Step 1: create .app with jpackage ─────────────────────
      - name: Create Mac .app bundle (jpackage, unsigned)
        run: |
          ant -f build_release.xml package-mac \
            -Dversion="$VERSION" \
            -Dversion_number="$VERSION_NUMBER" \
            -Dextra_release_tag="$EXTRA_TAG" \
            -Ddist.dir=dist

      # ── Step 2: sign the .app ──────────────────────────────────
      #
      # codesign --deep does NOT propagate --options runtime into
      # jpackage's Contents/runtime/ directory.  The bundled JRE dylibs
      # get signed but without the hardened-runtime flag, which causes
      # Apple's notarisation service to reject the submission:
      #   "The binary is not signed with a valid Developer ID certificate"
      #   "The signature does not include a secure timestamp"
      #
      # Fix: sign every Mach-O binary inside the bundle individually
      # (inside-out, innermost first), then sign the outer .app without
      # --deep (inner items are already valid at that point).
      - name: Sign .app bundle
        run: |
          APP="release/Mac/FigTree v${VERSION}/FigTree.app"
          ENTITLEMENTS="packaging_tools/mac/FigTree.entitlements"

          # 1. Sign all dylibs and shared objects (hardened runtime + timestamp)
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) \
            | while IFS= read -r f; do
                codesign --force --options runtime --timestamp \
                  --sign "$APP_SIGNER" "$f"
              done

          # 2. Sign executables inside the bundled runtime
          #    (java, keytool, jspawnhelper, jpackageapplauncher, …)
          #    Non-Mach-O files (shell scripts, text) are skipped silently.
          find "$APP/Contents/runtime" -type f -perm -u+x \
            | while IFS= read -r f; do
                codesign --force --options runtime --timestamp \
                  --sign "$APP_SIGNER" "$f" 2>/dev/null || true
              done

          # 3. Sign the outer .app — no --deep; all inner binaries are
          #    already individually signed with the correct flags above.
          codesign --force \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APP_SIGNER" \
            --verbose \
            "$APP"

      # ── Step 3: create the DMG ─────────────────────────────────
      - name: Create DMG
        run: |
          /usr/bin/hdiutil create -ov \
            -srcfolder "release/Mac/FigTree v${VERSION}" \
            -volname "FigTree v${VERSION}" \
            "release/FigTree v${VERSION}${EXTRA_TAG}.dmg"

      # ── Step 4: notarise and staple ────────────────────────────
      #
      # --output-format plist is intentionally NOT used here: some Xcode
      # toolchain versions suppress the non-zero exit code when a submission
      # is "Invalid" while that flag is active, letting the workflow continue
      # to the stapler step against a ticket that doesn't exist in CloudKit
      # (Error 65 "Record not found").  Plain-text output is easier to read
      # in CI logs and reliably exits non-zero on rejection.
      #
      # The submission ID is captured so the full notarisation log can be
      # fetched automatically if Apple rejects the submission.
      - name: Notarise DMG
        env:
          APPLE_ID:      ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          TEAM_ID:       ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          NOTARIZE_PASS: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          DMG="release/FigTree v${VERSION}${EXTRA_TAG}.dmg"

          # Submit and wait; exits non-zero if Apple rejects the submission
          NOTARY_OUTPUT=$(xcrun notarytool submit "$DMG" \
            --apple-id  "$APPLE_ID" \
            --team-id   "$TEAM_ID" \
            --password  "$NOTARIZE_PASS" \
            --wait 2>&1)
          echo "$NOTARY_OUTPUT"

          # Extract submission UUID for log retrieval
          SUBMISSION_ID=$(printf '%s' "$NOTARY_OUTPUT" | grep ' id:' | head -1 | awk '{print $NF}')

          # Fail loudly if Apple did not accept the submission
          if ! printf '%s' "$NOTARY_OUTPUT" | grep -q 'status: Accepted'; then
            echo "::error::Notarisation was not accepted."
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching notarisation log for submission $SUBMISSION_ID:"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARIZE_PASS" || true
            fi
            exit 1
          fi

      - name: Staple notarisation ticket
        run: |
          DMG="release/FigTree v${VERSION}${EXTRA_TAG}.dmg"
          xcrun stapler staple   "$DMG"
          xcrun stapler validate "$DMG"

      # ── Clean up keychain ──────────────────────────────────────
      - name: Delete signing keychain
        if: always()
        run: |
          # Restore the login keychain as default before deleting ours;
          # macOS runners reject deletion of the active default keychain.
          security default-keychain -s ~/Library/Keychains/login.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" || true

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload Mac DMGs
        uses: actions/upload-artifact@v4
        with:
          name: figtree-mac
          path: "release/FigTree v*.dmg"



  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build Linux package on an Ubuntu runner.
  # ───────────────────────────────────────────────────────────────────────────
  package-linux:
    name: Package (Linux)
    needs: build-jars
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11 (ANT runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: figtree-jar
          path: dist/

      - name: Set version env vars
        run: |
          echo "VERSION=${{ needs.build-jars.outputs.version }}"             >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=${{ needs.build-jars.outputs.version_number }}" >> "$GITHUB_ENV"
          echo "EXTRA_TAG=${{ needs.build-jars.outputs.extra_tag }}"         >> "$GITHUB_ENV"

      - name: Package Linux (TGZ)
        run: |
          ant -f build_release.xml package-linux \
            -Dversion="$VERSION" \
            -Dversion_number="$VERSION_NUMBER" \
            -Dextra_release_tag="$EXTRA_TAG" \
            -Ddist.dir=dist

      - name: Upload Linux TGZ
        uses: actions/upload-artifact@v4
        with:
          name: figtree-linux
          path: "release/FigTree_v*.tgz"


  # ───────────────────────────────────────────────────────────────────────────
  # 4. Build self-contained Windows package on a Windows runner.
  #
  #    jpackage only produces packages for the host platform, so Windows
  #    packaging must run on windows-latest. The JDK is bundled into the
  #    app-image so no system Java is required to run FigTree on Windows.
  # ───────────────────────────────────────────────────────────────────────────
  package-windows:
    name: Package (Windows)
    needs: build-jars
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21 includes jpackage and is used as the JRE bundled into the app.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: figtree-jar
          path: dist/

      - name: Set version env vars
        shell: bash
        run: |
          echo "VERSION=${{ needs.build-jars.outputs.version }}"             >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=${{ needs.build-jars.outputs.version_number }}" >> "$GITHUB_ENV"
          echo "EXTRA_TAG=${{ needs.build-jars.outputs.extra_tag }}"         >> "$GITHUB_ENV"

      - name: Package Windows (jpackage app-image + ZIP)
        shell: bash
        run: |
          ant -f build_release.xml package-windows \
            -Dversion="$VERSION" \
            -Dversion_number="$VERSION_NUMBER" \
            -Dextra_release_tag="$EXTRA_TAG" \
            -Ddist.dir=dist

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: figtree-windows
          path: "release/FigTree v*.zip"


  # ───────────────────────────────────────────────────────────────────────────
  # 5. Create a draft GitHub Release and attach all platform archives.
  #
  #    The release is created as a draft so you can review the artefacts and
  #    edit the release notes before publishing. Pre-release tags (those
  #    containing a hyphen, e.g. v1.5.0-beta1) are flagged as pre-releases.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-jars, package-mac, package-linux, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Mac DMG artifacts
        uses: actions/download-artifact@v4
        with:
          name: figtree-mac
          path: release-files/

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: figtree-windows
          path: release-files/

      - name: Download Linux TGZ artifact
        uses: actions/download-artifact@v4
        with:
          name: figtree-linux
          path: release-files/

      - name: List release files
        run: ls -lh release-files/

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: "FigTree v${{ needs.build-jars.outputs.version }}${{ needs.build-jars.outputs.extra_tag }}"
          draft: true
          prerelease: ${{ needs.build-jars.outputs.extra_tag != '' }}
          generate_release_notes: true
          files: |
            release-files/*.dmg
            release-files/*.zip
            release-files/*.tgz
